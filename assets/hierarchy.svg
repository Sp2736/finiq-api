<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Hierarchical access scopes" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="460" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <text x="40" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#e879f9">ONE FUNCTION DECIDES WHAT EVERY CALLER CAN SEE</text>
    <text x="40" y="60" font-size="12" fill="#94a3b8">HierarchyAccessService.resolveAccess() returns two axes — company scope and sub-broker scope — and fails closed on anything unrecognised.</text>

    <!-- nested scopes -->
    <rect x="40" y="85" width="1120" height="355" rx="16" fill="#1e1b4b" fill-opacity="0.35" stroke="#a78bfa" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.25;0.25;0.25;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="60" y="112" font-size="15" font-weight="700" fill="#c4b5fd">FINIQ_ADMIN</text>
    <text x="165" y="112" font-size="12" fill="#a5b4fc">every tenant, every company</text>

    <rect x="80" y="130" width="1040" height="290" rx="14" fill="#4a0d4e" fill-opacity="0.30" stroke="#e879f9" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;1;0.25;0.25;0.25" dur="8s" repeatCount="indefinite"/></rect>
    <text x="100" y="156" font-size="15" font-weight="700" fill="#f0abfc">TENANT_ADMIN</text>
    <text x="222" y="156" font-size="12" fill="#e9d5ff">all companies under one tenant</text>

    <rect x="120" y="174" width="960" height="226" rx="12" fill="#701a3a" fill-opacity="0.30" stroke="#f472b6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;0.25;1;0.25;0.25" dur="8s" repeatCount="indefinite"/></rect>
    <text x="140" y="200" font-size="15" font-weight="700" fill="#f9a8d4">COMPANY_ADMIN</text>
    <text x="270" y="200" font-size="12" fill="#fce7f3">one company, unrestricted inside it</text>

    <rect x="160" y="218" width="880" height="162" rx="10" fill="#0c4a6e" fill-opacity="0.30" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.25;0.25;0.25;1;0.25" dur="8s" repeatCount="indefinite"/></rect>
    <text x="180" y="244" font-size="15" font-weight="700" fill="#7dd3fc">BROKER / SUB_BROKER</text>
    <text x="364" y="244" font-size="12" fill="#bae6fd">self + every descendant in the downline (materialised path)</text>

    <!-- downline tree -->
    <g stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.6" fill="none">
      <path d="M600 285L440 335M600 285L760 335M440 335L360 365M440 335L520 365M760 335L680 365M760 335L840 365"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="600" cy="285" r="9"><animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="440" cy="335" r="7"/><circle cx="760" cy="335" r="7"/>
      <circle cx="360" cy="365" r="5.5"/><circle cx="520" cy="365" r="5.5"/><circle cx="680" cy="365" r="5.5"/><circle cx="840" cy="365" r="5.5"/>
    </g>
    <text x="620" y="283" font-size="12" fill="#e0f2fe">caller</text>
    <text x="1000" y="300" text-anchor="end" font-size="12" fill="#94a3b8">INVESTOR accounts use a separate</text>
    <text x="1000" y="316" text-anchor="end" font-size="12" fill="#94a3b8">login path — never this one.</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="459" rx="16" fill="none" stroke="#334155"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
