<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="FinIQ API banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1f1147"/><stop offset="1" stop-color="#4a0d4e"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f9a8d4"/><stop offset="0.5" stop-color="#e879f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-opacity="0.08"/></pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#grid)"/>

    <!-- hierarchy graph -->
    <g stroke="#e879f9" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M150 60L90 130M150 60L210 130M90 130L50 210M90 130L130 210M210 130L190 210M210 130L250 210"/>
      <path d="M1050 60L990 130M1050 60L1110 130M990 130L950 210M990 130L1030 210M1110 130L1090 210M1110 130L1150 210"/>
    </g>
    <g fill="#f472b6">
      <circle cx="150" cy="60" r="8"><animate attributeName="r" values="7;11;7" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="60" r="8"><animate attributeName="r" values="7;11;7" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#a78bfa">
      <circle cx="90" cy="130" r="6"/><circle cx="210" cy="130" r="6"/><circle cx="990" cy="130" r="6"/><circle cx="1110" cy="130" r="6"/>
    </g>
    <g fill="#818cf8">
      <circle cx="50" cy="210" r="4.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="210" r="4.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="210" r="4.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="210" r="4.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="210" r="4.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="210" r="4.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="210" r="4.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="210" r="4.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="2" fill="url(#title)">FinIQ API<animate attributeName="opacity" values="0.93;1;0.93" dur="4s" repeatCount="indefinite"/></text>
    <text x="600" y="174" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#ddd6fe" letter-spacing="3">MULTI-TENANT WEALTHTECH BACKEND</text>
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="318" y="206" width="118" height="32" rx="16" fill="#0b1020" stroke="#f472b6" stroke-opacity="0.7"/><text x="377" y="227" fill="#f472b6">NestJS</text>
      <rect x="452" y="206" width="132" height="32" rx="16" fill="#0b1020" stroke="#e879f9" stroke-opacity="0.7"/><text x="518" y="227" fill="#e879f9">TypeORM</text>
      <rect x="600" y="206" width="132" height="32" rx="16" fill="#0b1020" stroke="#a78bfa" stroke-opacity="0.7"/><text x="666" y="227" fill="#a78bfa">PostgreSQL</text>
      <rect x="748" y="206" width="118" height="32" rx="16" fill="#0b1020" stroke="#818cf8" stroke-opacity="0.7"/><text x="807" y="227" fill="#818cf8">Redis</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#7c3aed" stroke-opacity="0.45"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
